<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlaceMate: Placement Training Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#ffffff;--ink:#171b2d;--mut:#5d6883;--line:#e2e5f0;--brand:#4338ca;--brand-ink:#ffffff;--soft:#eceeff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--code:#0f172a;--codeink:#e2e8f0;--shadow:0 1px 2px rgba(20,24,50,.06),0 6px 20px rgba(20,24,50,.05);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--card:#171a2e;--ink:#e9ebf6;--mut:#9aa3bd;--line:#262b45;--brand:#818cf8;--brand-ink:#0e1120;--soft:#20244a;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1618;--warn:#fbbf24;--code:#0a0d1a;--shadow:none}}
:root[data-theme="dark"]{--bg:#0e1120;--card:#171a2e;--ink:#e9ebf6;--mut:#9aa3bd;--line:#262b45;--brand:#818cf8;--brand-ink:#0e1120;--soft:#20244a;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1618;--warn:#fbbf24;--code:#0a0d1a;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55}
h1{font-size:26px;margin:4px 0 6px;letter-spacing:-.02em}h2{font-size:19px;margin:24px 0 10px}h3{font-size:16px;margin:0 0 10px}h4{margin:14px 0 6px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 10px}small{display:block;color:var(--mut);font-size:12.5px}.muted{color:var(--mut)}.sub{color:var(--mut);margin-bottom:18px;max-width:70ch}
a{color:var(--brand)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}label input,label select,label textarea{margin-top:5px;font-weight:400}
label.inl{display:flex;align-items:center;gap:10px}label.inl select{width:auto;margin:0}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}.btn.danger,.danger{color:var(--bad)}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 0 0}
.back{background:none;border:0;color:var(--mut);padding:0 0 8px;font-weight:500}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em}.who{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mut)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;max-width:1200px;margin:0 auto}
.nav{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));align-self:start;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;background:none;border:0;padding:10px 12px;border-radius:10px;text-align:left;font-weight:500;color:var(--mut)}
.nav button:hover{background:var(--soft)}.nav button.on{background:var(--soft);color:var(--brand);font-weight:600}
main{padding:22px 24px 90px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.form{max-width:560px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{font-size:26px;letter-spacing:-.02em;display:block}.stat span{color:var(--mut);font-size:13px;display:block;margin-bottom:8px}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand)}.tile span{font-size:24px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row>div:first-child{flex:1;min-width:0}
.card>.row:hover,.chrow:hover{background:var(--soft)}
.chrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--brand);white-space:nowrap}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}.tabs button{background:none;border:0;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mut);white-space:nowrap}.tabs button.on{background:var(--soft);color:var(--brand)}
.tabs.pills button{border:1px solid var(--line)}.tabs.pills button.on{border-color:var(--brand)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.book{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .12s}.book:hover{transform:translateY(-3px)}
.cover,.cover-inline{background:linear-gradient(135deg,var(--bk),color-mix(in srgb,var(--bk) 55%,#000));color:#fff}
.cover{padding:22px 20px 18px 34px;min-height:190px;position:relative;display:flex;flex-direction:column}
.spine{position:absolute;left:0;top:0;bottom:0;width:16px;background:rgba(0,0,0,.28)}
.bt{font-size:21px;font-weight:700;line-height:1.2;letter-spacing:-.02em}.bs{font-size:13px;opacity:.85;margin-top:6px}.bp{margin-top:auto;padding-top:16px;font-size:13px}.bp .bar{background:rgba(255,255,255,.3);margin-bottom:6px}
.bm{padding:10px 14px;font-size:12.5px;color:var(--mut)}
.cover-inline{border-radius:14px;padding:16px 18px;margin-bottom:14px}.cover-inline small{color:rgba(255,255,255,.85)}.cover-inline .bar{background:rgba(255,255,255,.3);margin-top:10px}
.fl{margin:0;padding-left:20px}.fl li{margin:5px 0}.example{border-left:4px solid var(--brand)}.example ol{margin:6px 0 0;padding-left:20px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.qt{font-weight:600;margin-bottom:10px}.qt span{display:inline-block;background:var(--soft);color:var(--brand);border-radius:6px;padding:1px 8px;margin-right:8px;font-size:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button.opt:hover:not(:disabled){border-color:var(--brand);background:var(--soft)}
.opt.sel{border-color:var(--brand);background:var(--soft);font-weight:600}.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}.opt.right:disabled{color:var(--ok)}.opt.wrong:disabled{color:var(--bad)}
.expl{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}.expl.ok{background:var(--okbg)}.expl.bad{background:var(--badbg)}
.scorebox{background:var(--soft);border-radius:14px;padding:16px 18px;margin:16px 0}.scorebox.big{text-align:center;padding:26px}.scorebox.big b{font-size:44px;display:block;letter-spacing:-.03em}
details{border-bottom:1px solid var(--line);padding:2px 0}details:last-child{border-bottom:0}summary{cursor:pointer;padding:10px 0;font-weight:600}details p{color:var(--mut);padding:0 0 10px 4px}
details.card{padding:10px 16px}details.card summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:0;padding:8px 0;border-top:1px solid var(--line)}.chk input{width:auto;margin:3px 0 0}
.codebox{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;min-height:200px;background:var(--code);color:var(--codeink);border-color:var(--code);tab-size:2;resize:vertical}
.codeshow{background:var(--code);color:var(--codeink);border-radius:10px;padding:14px;overflow-x:auto;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin:8px 0}
.tests{margin-top:12px;display:grid;gap:6px}.trow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-radius:10px;font-size:13px}.trow.ok{background:var(--okbg)}.trow.bad{background:var(--badbg)}.trow code{font-family:'JetBrains Mono',monospace;font-size:12px;overflow-wrap:anywhere}
.testbar{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));z-index:10;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.timer{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}tr:last-child td{border-bottom:0}tr.clk{cursor:pointer}tr.clk:hover{background:var(--soft)}
.mini{display:flex;align-items:center;gap:8px;min-width:120px}.mini .bar{flex:1}.mini span{font-size:12px;width:34px}
.search{max-width:360px;margin-bottom:12px}
.chat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;height:min(52vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14.5px}.bub small{margin-bottom:2px;font-weight:600}.bub.ai{background:var(--soft);align-self:flex-start}.bub.me{background:var(--brand);color:var(--brand-ink);align-self:flex-end}.bub.me small{color:inherit;opacity:.8}
.ans{margin-top:12px}.dots{color:var(--mut);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.4}}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(150deg,#312e81,#4338ca 55%,#6d28d9);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero h1{font-size:38px;line-height:1.1;margin:0}.hero p{opacity:.9;max-width:46ch}.hero ul{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}.hero .logo{font-size:20px}
.modebadge{margin-top:12px;font-size:12.5px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;align-self:flex-start}.modebadge.live{background:rgba(74,222,128,.22)}
.panel{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:0 auto}
.panel .btn{width:100%;margin-top:6px}.panel .tabs{border-bottom:1px solid var(--line);margin-bottom:22px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:40}
.calc{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:240px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:40}
.calc input{text-align:right;font-size:20px;font-family:'JetBrains Mono',monospace;margin-bottom:8px}.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ckeys button{padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600}.ckeys .eq{grid-column:span 4;background:var(--brand);color:var(--brand-ink);border:0}
@media(max-width:860px){
 .login{grid-template-columns:1fr}.hero{padding:28px 22px}.hero h1{font-size:28px}.panel{padding:28px 22px}
 .app{grid-template-columns:1fr}.nav{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));z-index:15;flex-direction:row;overflow-x:auto;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;padding:8px 12px}
 main{padding:16px 14px 90px}.top{padding:10px 14px}.who span{display:none}.testbar{top:calc(103px + env(safe-area-inset-top,0px))}h1{font-size:22px}
}
</style>
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;color:var(--mut)">Loading PlaceMate…</div></div>
<div id="toast" role="status"></div>
<button id="calcBtn" class="fab" hidden onclick="toggleCalc()" aria-label="Calculator">🧮</button>
<div id="calc" class="calc" hidden><input id="cdisp" aria-label="Calculator display" autocomplete="off" inputmode="decimal"><div class="ckeys" id="ckeys"></div></div>
<script>
/* ============ CONTENT ============ */
const BOOKS=[
{id:'quant',title:'Quantitative Aptitude',short:'Quant',sub:'Percentages, profit & loss, time & work, interest and more',color:'#4338ca',chapters:[
{id:'q1',title:'Percentages',intro:"'Per cent' means 'per hundred'. Profit, interest and data questions are all percentages in disguise, so master this first.",
formulas:["x% of y = (x × y) / 100","Percentage change = (Change ÷ Original) × 100","Successive changes of a% and b% = a + b + (ab/100)%","Quick fractions: 1/2 = 50%, 1/3 = 33.33%, 1/4 = 25%, 1/5 = 20%, 1/8 = 12.5%"],
ex:{q:"A shirt's price rises from ₹400 to ₹500. What is the percentage increase?",s:["Change = 500 − 400 = 100","Percentage = (100 ÷ 400) × 100","= 25%"]},
qs:[
{q:"What is 15% of 240?",o:["24","30","36","42"],a:2,e:"240 × 15 / 100 = 36."},
{q:"A number increased by 25% becomes 150. What is the original number?",o:["100","110","120","125"],a:2,e:"x × 1.25 = 150, so x = 150 / 1.25 = 120."},
{q:"A price is increased by 10% and then by 20%. What is the net increase?",o:["30%","32%","35%","28%"],a:1,e:"a + b + ab/100 = 10 + 20 + (10×20)/100 = 32%."},
{q:"In an exam, 40% of 500 students failed. How many passed?",o:["200","250","300","350"],a:2,e:"Passed = 60% of 500 = 300."}]},
{id:'q2',title:'Profit & Loss',intro:"Profit and loss are always calculated on the cost price unless the question says otherwise. Discount is always on the marked price.",
formulas:["Profit = SP − CP; Loss = CP − SP","Profit % = (Profit ÷ CP) × 100","SP = CP × (100 + P%) / 100 (use minus for loss)","SP = MP × (100 − Discount%) / 100"],
ex:{q:"A bag costing ₹800 is sold for ₹1,000. Find the profit %.",s:["Profit = 1000 − 800 = 200","Profit % = (200 ÷ 800) × 100","= 25%"]},
qs:[
{q:"CP = ₹500 and SP = ₹600. What is the profit %?",o:["15%","20%","25%","10%"],a:1,e:"Profit = 100; (100/500)×100 = 20%."},
{q:"An article is sold at a 10% loss for ₹450. What is its cost price?",o:["₹480","₹500","₹495","₹520"],a:1,e:"SP = 0.9 × CP, so CP = 450 / 0.9 = ₹500."},
{q:"Marked price is ₹800 with a 15% discount. What is the selling price?",o:["₹660","₹680","₹700","₹720"],a:1,e:"SP = 800 × 85/100 = ₹680."},
{q:"The cost price of 12 articles equals the selling price of 10 articles. What is the profit %?",o:["10%","15%","20%","25%"],a:2,e:"Let CP of each = 1. SP of 10 = 12, so SP each = 1.2. Profit = 20%."}]},
{id:'q3',title:'Ratio & Proportion',intro:"A ratio compares two quantities. Always convert the ratio into 'parts' and find the value of one part.",
formulas:["a : b = a / b","Share of a in ratio a:b of total T = T × a / (a + b)","If a : b = c : d then a × d = b × c","Sum of parts = a + b"],
ex:{q:"Divide ₹900 in the ratio 2 : 7.",s:["Total parts = 2 + 7 = 9","One part = 900 / 9 = 100","Shares = 200 and 700"]},
qs:[
{q:"Divide ₹1200 in the ratio 3 : 5. What is the larger share?",o:["₹450","₹600","₹750","₹800"],a:2,e:"Larger share = 1200 × 5/8 = ₹750."},
{q:"If 3 : x = 9 : 15, find x.",o:["4","5","6","7"],a:1,e:"3 × 15 = 9 × x, so x = 45 / 9 = 5."},
{q:"The ages of A and B are in the ratio 4 : 5 and their sum is 45. What is A's age?",o:["18","20","24","25"],a:1,e:"A = 45 × 4/9 = 20."},
{q:"Two numbers are in the ratio 2 : 3 and the sum of their squares is 468. Find the larger number.",o:["12","15","18","21"],a:2,e:"(2k)² + (3k)² = 13k² = 468, so k² = 36 and k = 6. Larger = 3k = 18."}]},
{id:'q4',title:'Time & Work',intro:"Treat total work as 1 unit (or as the LCM of the days) and think in terms of work done per day.",
formulas:["Rate = 1 / days","Together: T = (A × B) / (A + B)","LCM method: total work = LCM of days","Man-days: M₁ × D₁ = M₂ × D₂"],
ex:{q:"A can finish a job in 12 days and B in 6 days. How long together?",s:["Total work = LCM(12, 6) = 12 units","A does 1 unit/day, B does 2 units/day, together 3 units/day","Time = 12 / 3 = 4 days"]},
qs:[
{q:"A can do a work in 10 days and B in 15 days. Working together, how many days do they need?",o:["5","6","7","8"],a:1,e:"LCM = 30 units. A = 3/day, B = 2/day, together 5/day, so 30/5 = 6 days."},
{q:"A does 1/3 of a work in 5 days. How many days for the whole work?",o:["10","12","15","18"],a:2,e:"Whole work = 5 × 3 = 15 days."},
{q:"8 men finish a job in 12 days. How many days will 6 men need?",o:["14","16","18","20"],a:1,e:"Man-days = 96. 96 / 6 = 16 days."},
{q:"A alone takes 12 days and B alone 24 days. They work together for 4 days, then A leaves. How many more days does B need to finish?",o:["8","10","12","14"],a:2,e:"Together rate = 1/12 + 1/24 = 1/8 per day. In 4 days half is done. B does the other half in 12 days (1/24 per day)."}]},
{id:'q5',title:'Time, Speed & Distance',intro:"Keep units consistent. Convert km/h to m/s by multiplying by 5/18 whenever a train's length in metres is involved.",
formulas:["Speed = Distance / Time","km/h → m/s: × 5/18; m/s → km/h: × 18/5","Average speed (equal distances) = 2xy / (x + y)","Trains in opposite directions: relative speed = sum; same direction = difference","Time to cross a pole = length / speed"],
ex:{q:"A car covers 150 km in 3 hours. Find its speed in m/s.",s:["Speed = 150 / 3 = 50 km/h","In m/s = 50 × 5/18","≈ 13.9 m/s"]},
qs:[
{q:"Convert 72 km/h to m/s.",o:["15","18","20","25"],a:2,e:"72 × 5/18 = 20 m/s."},
{q:"A car goes 60 km at 30 km/h and returns the same 60 km at 60 km/h. What is the average speed?",o:["40 km/h","45 km/h","48 km/h","50 km/h"],a:0,e:"2xy/(x+y) = 2×30×60/90 = 40 km/h."},
{q:"A 150 m long train running at 54 km/h crosses a pole. How long does it take?",o:["8 s","10 s","12 s","15 s"],a:1,e:"54 km/h = 15 m/s. Time = 150/15 = 10 s."},
{q:"Two trains of length 100 m and 150 m run in opposite directions at 36 km/h and 54 km/h. How long do they take to cross each other?",o:["8 s","10 s","12 s","15 s"],a:1,e:"Relative speed = 90 km/h = 25 m/s. Distance = 250 m. Time = 250/25 = 10 s."}]},
{id:'q6',title:'Simple & Compound Interest',intro:"Simple interest grows the same amount every year; compound interest earns interest on interest.",
formulas:["SI = (P × R × T) / 100","Amount = P + SI","CI amount = P (1 + R/100)ⁿ","CI − SI for 2 years = P (R/100)²"],
ex:{q:"Find the SI on ₹5000 at 6% p.a. for 2 years.",s:["SI = (5000 × 6 × 2) / 100","= ₹600"]},
qs:[

hint:"Look at the loop condition. What is arr[arr.length]?",
solution:`function sumArray(arr) {\n  let sum = 0;\n  for (let i = 0; i < arr.length; i++) {\n    sum += arr[i];\n  }\n  return sum;\n}`,
why:"Off-by-one error: valid indexes are 0 to length − 1. With <= the loop reads arr[length], which is undefined, and adding undefined gives NaN. Interviewers love this one.",

<script>
/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const sidOf=r=>String(r).trim().toLowerCase().replace(/[^a-z0-9_\-.]/g,'');
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'-';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
let CAN_RUN=false;try{CAN_RUN=new Function('return 1')()===1}catch(e){}

const BRANCHES=['CSE','IT','ECE','EEE','Civil','Mechanical','Other'];
const BR_KEY={CSE:'cse',IT:'cse',ECE:'ece',EEE:'eee',Civil:'civil',Mechanical:'mech',Other:'cse'};

/* ============ QUESTION BANK ============ */
const BANK={};
BOOKS.forEach(b=>b.chapters.forEach(c=>c.qs.forEach((q,i)=>{BANK[`a:${c.id}:${i}`]={...q,id:`a:${c.id}:${i}`,cat:b.short,src:c.title}})));
Object.entries(TECH).forEach(([k,t])=>t.mcq.forEach((q,i)=>{BANK[`t:${k}:${i}`]={...q,id:`t:${k}:${i}`,cat:t.name+' Technical',src:t.name}}));
SOFTQ.forEach((q,i)=>{BANK[`s:soft:${i}`]={...q,id:`s:soft:${i}`,cat:'Soft Skills',src:'Soft skills'}});
const CATS=['Quant','Logical','Verbal','Soft Skills','EEE Technical','ECE Technical','Civil Technical','Mechanical Technical','CSE/IT Technical','Custom'];

/* ============ STATE + DATA LAYER ============ */
const S={db:null,user:null,sample:null,dl:null,role:null,me:null,view:'home',sub:null,lt:'login',P:null,assess:[],custom:[],students:[],progAll:{},results:[],myResults:[],code:{},test:null,iv:null,unsubs:[],tb:'cse',ctab:'IT',rsel:'',search:''};
const MEM=(()=>{try{return JSON.parse(LS.get('pm_local')||'{}')}catch(e){return{}}})();
const LIS={};
const lPersist=()=>LS.set('pm_local',JSON.stringify(MEM));
const lRows=(col,f)=>{let r=Object.entries(MEM[col]||{}).map(([id,v])=>({...clone(v),id}));if(f)r=r.filter(x=>x[f[0]]===f[1]);return r};
const lNotify=col=>(LIS[col]||[]).forEach(l=>l.fire());
async function dSet(col,id,obj){if(S.db){await S.db.doc(col+'/'+id).set(obj)}else{(MEM[col]=MEM[col]||{})[id]=clone(obj);lPersist();lNotify(col)}}
async function dGet(col,id){if(S.db){const s=await S.db.doc(col+'/'+id).get();return s.exists?{...clone(s.data()),id}:null}const v=(MEM[col]||{})[id];return v?{...clone(v),id}:null}
async function dDel(col,id){if(S.db){await S.db.doc(col+'/'+id).delete()}else{if(MEM[col])delete MEM[col][id];lPersist();lNotify(col)}}
function dWatch(col,cb,f){
 if(S.db){let q=S.db.collection(col);if(f)q=q.where(f[0],'==',f[1]);const u=q.onSnapshot(s=>cb(s.docs.map(d=>({...clone(d.data()),id:d.id}))),e=>console.warn('watch',col,e&&e.code));S.unsubs.push(u);return}
 const l={fire:()=>cb(lRows(col,f))};(LIS[col]=LIS[col]||[]).push(l);l.fire();S.unsubs.push(()=>{LIS[col]=(LIS[col]||[]).filter(x=>x!==l)});
}
const strip=o=>{const c={...o};delete c.id;return c};

/* ============ PROGRESS ============ */
function chState(ch,P){const a=((P.chapters||{})[ch.id]||{}).answers||{};let done=0,corr=0;ch.qs.forEach((q,i)=>{if(a[i]!==undefined){done++;if(a[i]===q.a)corr++}});return{done,corr,total:ch.qs.length,complete:done===ch.qs.length}}
function bookState(b,P){let qDone=0,qTotal=0,corr=0,chDone=0;b.chapters.forEach(c=>{const s=chState(c,P);qDone+=s.done;qTotal+=s.total;corr+=s.corr;if(s.complete)chDone++});return{qDone,qTotal,corr,chDone,chTotal:b.chapters.length,pct:qTotal?Math.round(qDone/qTotal*100):0}}
function progStats(P){P=P||{};let qDone=0,qTotal=0,corr=0,chDone=0,chTotal=0;BOOKS.forEach(b=>{const s=bookState(b,P);qDone+=s.qDone;qTotal+=s.qTotal;corr+=s.corr;chDone+=s.chDone;chTotal+=s.chTotal});return{qDone,qTotal,corr,chDone,chTotal,pct:qTotal?Math.round(qDone/qTotal*100):0,acc:qDone?Math.round(corr/qDone*100):0,coding:Object.keys(P.coding||{}).length}}
let saveTimer=null,saving=false,dirty=false;
function saveP(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){if(saving){saveTimer=setTimeout(flush,400);return}if(!dirty||!S.me)return;saving=true;dirty=false;try{await dSet('progress',S.me.id,{...S.P,sid:S.me.id,name:S.me.name,branch:S.me.branch,updated:Date.now()})}catch(e){toast('Could not save progress (check connection)')}saving=false}

/* ============ BOOT + AUTH ============ */
async function boot(){
 const cl=window.claude;
 const grab=async n=>{try{if(!cl||!cl.use)return null;return await Promise.race([cl.use(n),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){return null}};
 const [db,user,sample,dl]=await Promise.all([grab('db'),grab('user'),grab('sample'),grab('downloads')]);
 S.db=db;S.user=user;S.sample=sample;S.dl=dl;
 const sid=LS.get('pm_session');
 if(sid){try{const st=await dGet('students',sid);if(st){await startStudent(st);return}}catch(e){}}
 if(LS.get('pm_admin')==='1'&&await adminAllowed()){startAdmin();return}
 renderLogin();
}
async function adminAllowed(pass){
 if(S.user){try{return !!(await S.user.canEdit())}catch(e){return false}}
 return pass==='admin123'||LS.get('pm_admin')==='1'&&!S.db;
}
function renderLogin(){
 const live=!!S.db;
 const tabs=[['login','Student login'],['reg','New student'],['admin','Admin']];
 let form='';
 if(S.lt==='login')form=`<h2>Welcome back</h2><p class="sub">Log in with your roll number to continue learning.</p>
  <label>Roll / Register number<input id="lr" autocomplete="username" placeholder="e.g. 21CS101"></label>
  <label>Password<input id="lp" type="password" autocomplete="current-password" placeholder="Your password"></label>
  <button class="btn" onclick="doLogin()">Log in</button>`;
 else if(S.lt==='reg')form=`<h2>Create student account</h2><p class="sub">Your branch decides the technical practice shown to you.</p>
  <label>Full name<input id="rn" placeholder="Your name"></label>
  <label>Roll / Register number<input id="rr" placeholder="e.g. 21CS101"></label>
  <label>Branch<select id="rb">${BRANCHES.map(b=>`<option>${b}</option>`).join('')}</select></label>
  <label>Create password<input id="rp" type="password" placeholder="At least 4 characters"></label>
  <button class="btn" onclick="doRegister()">Create account</button>`;
 else form=`<h2>Admin / Trainer login</h2>`+(S.user?
  `<p class="sub">Admin access is limited to the owner of this portal and people given <b>edit</b> access to the page.</p><button class="btn" onclick="doAdmin()">Continue as admin</button>`:
  `<p class="sub">Demo mode: enter the demo passcode <b>admin123</b>. In the shared (live) version, admin access is tied to the portal owner's account instead.</p><label>Passcode<input id="ap" type="password" placeholder="Passcode"></label><button class="btn" onclick="doAdmin()">Log in as admin</button>`);
 $('#app').innerHTML=`<div class="login"><section class="hero"><div class="logo">🎓 PlaceMate</div><h1>Crack your campus placements.</h1><p>Aptitude books, core technical prep, a coding lab, company-wise interview questions, timed assessments and an AI mock interview, all in one place.</p>
 <ul><li>📚 Aptitude books with progress tracking</li><li>🛠️ EEE · ECE · Civil · Mech · CSE/IT interview prep</li><li>💻 Debug and solve code with instant test results</li><li>🤖 AI mock interviews with a scored report</li></ul>
 <div class="modebadge ${live?'live':''}">${live?'● Live: shared data, admin sees all students':'● Demo mode: data is saved only in this browser'}</div></section>
 <section class="panel"><div class="tabs">${tabs.map(t=>`<button class="${S.lt===t[0]?'on':''}" onclick="S.lt='${t[0]}';renderLogin()">${t[1]}</button>`).join('')}</div>${form}</section></div>`;
 document.querySelectorAll('.panel input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){S.lt==='login'?doLogin():S.lt==='reg'?doRegister():doAdmin()}}));
}
async function doRegister(){
 const name=$('#rn').value.trim(),roll=$('#rr').value.trim(),br=$('#rb').value,pw=$('#rp').value,sid=sidOf(roll);
 if(!name||!sid||pw.length<4){toast('Fill all fields (password: 4+ characters)');return}
 try{if(await dGet('students',sid)){toast('That roll number is already registered. Log in instead.');return}
  const st={name,roll,branch:br,ph:hash(pw+sid),created:Date.now()};await dSet('students',sid,st);await startStudent({...st,id:sid})}catch(e){toast('Could not register. Ask your trainer for access.')}
}
async function doLogin(){
 const sid=sidOf($('#lr').value),pw=$('#lp').value;if(!sid||!pw){toast('Enter roll number and password');return}
 try{const st=await dGet('students',sid);if(!st||st.ph!==hash(pw+sid)){toast('Roll number or password is incorrect');return}await startStudent(st)}catch(e){toast('Could not log in. Check your connection.')}
}
async function doAdmin(){
 const ok=await adminAllowed($('#ap')?$('#ap').value:'');
 if(!ok){toast(S.user?'This account does not have admin (edit) access to the portal':'Wrong passcode');return}
 LS.set('pm_admin','1');startAdmin();
}
async function startStudent(st){
 S.role='student';S.me=st;LS.set('pm_session',st.id);LS.del('pm_admin');
 const p=await dGet('progress',st.id);
 S.P=p?{chapters:p.chapters||{},coding:p.coding||{},interviews:p.interviews||[]}:{chapters:{},coding:{},interviews:[]};
 S.tb=BR_KEY[st.branch]||'cse';
 dWatch('assessments',r=>{S.assess=r.sort((a,b)=>(b.created||0)-(a.created||0));soft(['home','assess'])});
 dWatch('questions',r=>{S.custom=r;rebuildCustom()});
 dWatch('results',r=>{S.myResults=r;soft(['home','assess','scores'])},['sid',st.id]);
 S.view='home';shell();
}
function startAdmin(){
 S.role='admin';S.me={name:'Trainer'};
 dWatch('students',r=>{S.students=r;soft(['a_over','a_stud'])});
 dWatch('progress',r=>{S.progAll={};r.forEach(x=>S.progAll[x.id]=x);soft(['a_over','a_stud','a_stu'])});
 dWatch('results',r=>{S.results=r;soft(['a_over','a_stud','a_stu','a_asm','a_res'])});
 dWatch('assessments',r=>{S.assess=r.sort((a,b)=>(b.created||0)-(a.created||0));soft(['a_over','a_asm','a_res'])});
 dWatch('questions',r=>{S.custom=r;rebuildCustom();soft(['a_bank'])});

function tickTimer(){clearInterval(S.timer);const upd=()=>{const el=$('#timer');if(!el||!S.test||S.test.done){clearInterval(S.timer);return}const s=Math.max(0,Math.round((S.test.end-Date.now())/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el.classList.toggle('low',s<60);if(s<=0){clearInterval(S.timer);toast("Time's up! Submitting…");submitTest()}};upd();tickCount();S.timer=setInterval(upd,1000)}
async function submitTest(){
 const t=S.test;if(!t||t.done)return;clearInterval(S.timer);
 t.score=t.qs.reduce((a,q,i)=>a+(t.ans[i]===q.a?1:0),0);t.pct=Math.round(t.score/t.qs.length*100);t.done=true;paint();window.scrollTo(0,0);
 const prev=S.myResults.find(r=>r.key===t.key);
 try{await dSet('results',S.me.id+'__'+t.key,{sid:S.me.id,name:S.me.name,roll:S.me.roll,branch:S.me.branch,key:t.key,title:t.title,kind:t.kind,score:t.score,total:t.qs.length,pct:t.pct,best:Math.max(prev?.best||0,t.pct),attempts:(prev?.attempts||0)+1,ts:Date.now()});toast('Score saved')}catch(e){toast('Could not save score. Check your connection.')}
}

function vIv(){
 const iv=S.iv;
 if(!S.sample)return `<h1>AI Mock Interview</h1><section class="card"><p>The AI interviewer isn't available in this view. Open the portal from your Claude account (or ask your trainer for the shared link) to use it.</p><p class="muted">Meanwhile, practise the questions in <a href="#" onclick="go('comp');return false">Company Q&A</a> and <a href="#" onclick="go('tech');return false">Technical Prep</a> out loud.</p></section>`;
 if(!iv||iv.stage==='setup'){
  const br=BR_KEY[S.me.branch]||'cse';
  return `<h1>AI Mock Interview</h1><p class="sub">Answer 5 questions like in a real interview. You get feedback after every answer and a scored report at the end.</p>
  <section class="card form"><label>Interview type<select id="ivMode"><option value="hr">HR round</option><option value="tech">Technical round (my branch)</option><option value="company" ${S.ivco?'selected':''}>Company-style round</option><option value="mixed">Mixed HR + technical</option></select></label>
  <label>Branch<select id="ivBranch">${Object.entries(TECH).map(([k,v])=>`<option value="${k}" ${k===br?'selected':''}>${v.name}</option>`).join('')}</select></label>
  <label>Company (for company round)<select id="ivCo"><option value="">Any company</option>${COMPANIES.map(c=>`<option value="${c.id}" ${S.ivco===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>
  <label>Difficulty<select id="ivLvl"><option>Easy (fresher)</option><option selected>Medium</option><option>Hard</option></select></label>
  <button class="btn" onclick="ivStart()">Start interview</button><p class="muted">Uses your own Claude usage. Type your answers as you would speak them.</p></section>
  ${(S.P.interviews||[]).length?`<h2>Previous interviews</h2>${S.P.interviews.map(r=>`<div class="row"><div><b>${esc(r.label)}</b><small>${fmtDate(r.ts)}</small></div><span class="pill ${r.overall>=6?'ok':'bad'}">${r.overall}/10</span></div>`).join('')}`:''}`;
 }
 if(iv.stage==='report')return ivReportView();
 return `<div class="between"><h1>Interview in progress</h1><span class="pill">Answer ${Math.min(iv.answers+1,5)} of 5</span></div><div id="chat" class="chat"></div>
 <div class="ans"><textarea id="ans" rows="4" placeholder="Type your answer… (Ctrl+Enter to send)" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))ivSend()"></textarea><div class="btnrow"><button class="btn" id="ivSendBtn" onclick="ivSend()">Send answer</button><button class="btn ghost" onclick="ivStop()">Stop</button><button class="btn ghost" onclick="ivEnd()">End & get report</button></div></div>`;
}
function ivPreset(co){S.ivco=co;S.iv=null;go('iv')}
function ivRules(){
 const iv=S.iv,t=TECH[iv.br],co=COMPANIES.find(c=>c.id===iv.co);
 const kind=iv.mode==='hr'?'HR / behavioural':iv.mode==='tech'?`technical (${t.name} core subjects and fundamentals)`:iv.mode==='company'?`company-style ${co?co.name+' ':''}campus interview (mix of technical and HR${co?', reflecting its typical process: '+co.process.join('; '):''})`:`mixed HR and technical (${t.name})`;
 return `You are a friendly but professional campus-placement interviewer in India conducting a mock ${kind} interview for a final-year ${t.name} engineering student. Difficulty: ${iv.lvl}.
Rules: Ask exactly ONE question at a time and exactly 5 questions in total. After each candidate answer, give 1-2 sentences of specific feedback (what was good, what was missing), then ask the next question. After the 5th answer, do NOT ask a new question: give brief feedback and say the interview is complete. Keep every reply under 90 words. Plain text only, no markdown or bullet lists. Do not answer your own questions for the candidate.`;
}
async function ivStart(){
 S.iv={stage:'chat',mode:$('#ivMode').value,br:$('#ivBranch').value,co:$('#ivCo').value,lvl:$('#ivLvl').value,turns:[],answers:0,busy:false,stream:''};
 S.iv.turns.push({role:'user',content:ivRules()+'\n\nThe candidate is ready. Greet them in one line and ask question 1.'});
 paint();await ivCall();
}
async function ivCall(){
 const iv=S.iv;iv.busy=true;iv.ctl=new AbortController();iv.stream='';redrawChat();
 try{const {text}=await S.sample(iv.turns,{cache:false,modelTier:'quick',signal:iv.ctl.signal,onText:({text})=>{iv.stream=text;streamUpdate()}});iv.turns.push({role:'assistant',content:text})}
 catch(e){if(e.code!=='cancelled'){iv.err=e.code==='not_granted'?'You declined AI access, so the interviewer cannot continue.':e.code==='rate_limited'?'Too many requests. Wait a moment and send again.':'The interviewer could not respond. Try sending again.'}if(e.text&&e.code==='cancelled')iv.turns.push({role:'assistant',content:e.text})}
 iv.busy=false;iv.stream='';redrawChat();
}
async function ivSend(){
 const iv=S.iv,el=$('#ans');if(!iv||iv.busy||!el)return;const v=el.value.trim();if(!v)return;
 if(iv.turns[iv.turns.length-1].role==='user'){toast('Wait for the interviewer first');return}
 iv.err='';iv.turns.push({role:'user',content:v});iv.answers++;el.value='';await ivCall();
 if(iv.answers>=5&&iv.turns[iv.turns.length-1].role==='assistant')await ivReport();
}
async function ivRetry(){const iv=S.iv;if(!iv||iv.busy)return;iv.err='';await ivCall();if(iv.answers>=5&&iv.turns[iv.turns.length-1].role==='assistant')await ivReport()}
function ivStop(){if(S.iv&&S.iv.ctl)S.iv.ctl.abort()}
async function ivEnd(){const iv=S.iv;if(!iv||iv.busy)return;if(iv.answers<1){S.iv=null;paint();return}if(iv.turns[iv.turns.length-1].role==='user'){toast('Wait for the interviewer to reply first');return}await ivReport()}
function redrawChat(){
 const c=$('#chat');if(!c||!S.iv)return;const iv=S.iv;
 c.innerHTML=iv.turns.map((t,i)=>i===0?'':`<div class="bub ${t.role==='user'?'me':'ai'}"><small>${t.role==='user'?'You':'Interviewer'}</small>${nl(t.content)}</div>`).join('')+(iv.busy?`<div class="bub ai" id="live"><small>Interviewer</small><span id="livetxt">${iv.stream?nl(iv.stream):'<i class="dots">Thinking…</i>'}</span></div>`:'')+(iv.err?`<div class="expl bad">${esc(iv.err)} <button class="btn sm" onclick="ivRetry()">Retry</button></div>`:'');
 const b=$('#ivSendBtn');if(b)b.disabled=iv.busy;c.scrollTop=c.scrollHeight;
}
function streamUpdate(){const l=$('#livetxt');if(l&&S.iv){l.innerHTML=nl(S.iv.stream);const c=$('#chat');c.scrollTop=c.scrollHeight}}
async function ivReport(){
 const iv=S.iv;iv.stage='report';iv.report=null;iv.busy=true;paint();
 const tr=iv.turns.slice(1).map(t=>(t.role==='user'?'CANDIDATE: ':'INTERVIEWER: ')+t.content).join('\n\n');
 const label=(iv.mode==='hr'?'HR round':iv.mode==='tech'?TECH[iv.br].name+' technical':iv.mode==='company'?(COMPANIES.find(c=>c.id===iv.co)?.name||'Company')+' round':'Mixed round');
 try{
  const r=await S.sample.json(`Evaluate this mock campus-placement interview transcript for a fresher. Be fair and specific.\n\n${tr}\n\nReply with ONLY a JSON object of this exact shape:\n{"overall":7,"communication":7,"content":6,"confidence":7,"summary":"one sentence","strengths":["..",".."],"improvements":["..",".."],"tip":"one practical tip for next time"}\nAll scores are integers from 0 to 10.`,{cache:false,modelTier:'default'});
  const n=v=>Math.max(0,Math.min(10,Math.round(Number(v)||0)));
  iv.report={overall:n(r.overall),communication:n(r.communication),content:n(r.content),confidence:n(r.confidence),summary:String(r.summary||''),strengths:(r.strengths||[]).map(String).slice(0,4),improvements:(r.improvements||[]).map(String).slice(0,4),tip:String(r.tip||'')};
  S.P.interviews=[{ts:Date.now(),label,overall:iv.report.overall,summary:iv.report.summary},...(S.P.interviews||[])].slice(0,10);saveP();
  const prev=S.myResults.find(x=>x.key==='iv');
  try{await dSet('results',S.me.id+'__iv',{sid:S.me.id,name:S.me.name,roll:S.me.roll,branch:S.me.branch,key:'iv',title:'AI mock interview',kind:'interview',score:iv.report.overall,total:10,pct:iv.report.overall*10,best:Math.max(prev?.best||0,iv.report.overall*10),attempts:(prev?.attempts||0)+1,ts:Date.now()})}catch(e){}
 }catch(e){iv.reportErr=e.code==='not_granted'?'AI access was declined.':'The report could not be generated. You can try ending the interview again.'}
 iv.busy=false;if(S.view==='iv')paint();
}
function ivReportView(){
 const iv=S.iv,r=iv.report;
 if(iv.busy)return `<h1>Preparing your report…</h1><section class="card"><p class="dots">Reviewing your answers. This takes up to a minute.</p></section>`;
 if(!r)return `<h1>Interview report</h1><div class="expl bad">${esc(iv.reportErr||'No report.')}</div><div class="btnrow"><button class="btn" onclick="ivReport()">Try again</button><button class="btn ghost" onclick="S.iv=null;paint()">Back</button></div>`;
 const m=(l,v)=>`<div class="stat"><b>${v}/10</b><span>${l}</span>${bar(v*10,v>=6?'var(--ok)':'var(--warn)')}</div>`;
 return `<h1>Interview report</h1><div class="scorebox big"><b>${r.overall}/10</b><span>${esc(r.summary)}</span></div>
 <div class="stats">${m('Communication',r.communication)}${m('Answer content',r.content)}${m('Confidence',r.confidence)}</div>
 <div class="grid2"><section class="card"><h3>👍 Strengths</h3><ul class="fl">${r.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="card"><h3>🎯 To improve</h3><ul class="fl">${r.improvements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section></div>
 ${r.tip?`<div class="expl"><b>Tip:</b> ${esc(r.tip)}</div>`:''}<div class="btnrow"><button class="btn" onclick="S.iv=null;paint()">New interview</button></div>`;
}

 <section class="card form"><label>Category<select id="bc">${CATS.map(c=>`<option ${c==='Custom'?'selected':''}>${c}</option>`).join('')}</select></label><label>Question<textarea id="bq" rows="2"></textarea></label>
 ${[0,1,2,3].map(i=>`<label>Option ${String.fromCharCode(65+i)}<input class="bo"></label>`).join('')}
 <label>Correct option<select id="ba"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label><label>Explanation (optional)<input id="be"></label><button class="btn" onclick="addQ()">Add question</button></section>
 <h2>Your questions (${S.custom.length})</h2>${S.custom.length?S.custom.map(q=>`<div class="row"><div><b>${esc(q.q)}</b><small>${esc(q.cat)} · answer: ${esc(q.o[q.a])}</small></div><button class="btn sm ghost danger" onclick="delQ('${q.id}')">Delete</button></div>`).join(''):'<p class="muted">None yet. The built-in bank has '+Object.keys(BANK).filter(k=>!k.startsWith('c:')).length+' questions.</p>'}`;
}
async function addQ(){
 const q=$('#bq').value.trim(),o=[...document.querySelectorAll('.bo')].map(i=>i.value.trim());
 if(!q||o.some(x=>!x)){toast('Enter the question and all 4 options');return}
 try{await dSet('questions','c'+Date.now().toString(36),{q,o,a:parseInt($('#ba').value),e:$('#be').value.trim(),cat:$('#bc').value,created:Date.now()});toast('Question added');$('#bq').value='';document.querySelectorAll('.bo').forEach(i=>i.value='');$('#be').value=''}catch(e){toast('Could not add (admin access needed)')}
}
async function delQ(id){if(confirm('Delete this question?'))try{await dDel('questions',id)}catch(e){toast('Could not delete')}}
function vARes(){
 const keys=[...new Map(S.results.filter(r=>r.kind!=='interview').map(r=>[r.key,r.title])).entries()];
 S.assess.forEach(a=>{if(!keys.find(k=>k[0]==='a_'+a.id))keys.push(['a_'+a.id,a.title])});
 keys.sort((a,b)=>(a[0].startsWith('a_')?0:1)-(b[0].startsWith('a_')?0:1));
 if(!S.rsel&&keys.length)S.rsel=keys[0][0];
 const rs=S.results.filter(r=>r.key===S.rsel).sort((a,b)=>b.pct-a.pct),ps=rs.map(r=>r.pct);
 return `<div class="between"><div><h1>Results</h1><p class="sub">Score details for every student on a test.</p></div><button class="btn ghost sm" onclick="exportCSV(true)">⬇ Export CSV</button></div>
 <label class="inl">Test <select onchange="S.rsel=this.value;paint()">${keys.map(k=>`<option value="${esc(k[0])}" ${k[0]===S.rsel?'selected':''}>${esc(k[1])}${k[0].startsWith('a_')?' (assigned)':''}</option>`).join('')}</select></label>
 ${rs.length?`<div class="stats"><div class="stat"><b>${rs.length}</b><span>Students attempted</span></div><div class="stat"><b>${avg(ps)}%</b><span>Class average</span></div><div class="stat"><b>${Math.max(...ps)}%</b><span>Highest</span></div><div class="stat"><b>${Math.min(...ps)}%</b><span>Lowest</span></div><div class="stat"><b>${Math.round(ps.filter(p=>p>=50).length/ps.length*100)}%</b><span>Scored 50%+</span></div></div>
 <div class="tbl"><table><tr><th>#</th><th>Student</th><th>Roll</th><th>Branch</th><th>Score</th><th>%</th><th>Best</th><th>Attempts</th><th>Date</th></tr>${rs.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.roll||'')}</td><td>${esc(r.branch)}</td><td>${r.score}/${r.total}</td><td><span class="pill ${r.pct>=50?'ok':'bad'}">${r.pct}%</span></td><td>${r.best}%</td><td>${r.attempts}</td><td>${fmtDate(r.ts)}</td></tr>`).join('')}</table></div>`:'<section class="card"><p class="muted">No attempts on this test yet.</p></section>'}`;
}
async function exportCSV(resOnly){
 const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;let csv;
 if(resOnly){csv='Test,Student,Roll,Branch,Score,Total,Percent,Best,Attempts,Date\n'+S.results.filter(r=>r.key===S.rsel).map(r=>[r.title,r.name,r.roll,r.branch,r.score,r.total,r.pct,r.best,r.attempts,fmtDate(r.ts)].map(q).join(',')).join('\n')}
 else csv='Name,Roll,Branch,Aptitude done %,Accuracy %,Coding solved,Tests taken,Avg test %,Interview /10\n'+stuRows().map(r=>[r.s.name,r.s.roll,r.s.branch,r.apt,r.acc,r.coding,r.nTests,r.avg,r.iv===null?'':r.iv/10].map(q).join(',')).join('\n');
 if(!S.dl){toast('Download is not available in this view');return}
 try{await S.dl.save({filename:resOnly?'test-results.csv':'students-report.csv',data:csv})}catch(e){if(e.code!=='declined')toast('Could not save the file')}
}

/* ============ CALCULATOR (no eval) ============ */
function calcEval(s){s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');let i=0;
 const num=()=>{const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
 const post=v=>{while(s[i]==='%'){i++;v/=100}return v};
 const atom=()=>{if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return post(v)}if(s[i]==='-'){i++;return -atom()}return post(num())};
 const term=()=>{let v=atom();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=atom();v=o==='*'?v*r:v/r}return v};
 const expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=term();v=o==='+'?v+r:v-r}return v};
 const v=expr();if(i!==s.length)throw 0;return v}
function initCalc(){
 const keys=['C','(',')','⌫','7','8','9','÷','4','5','6','×','1','2','3','-','0','.','%','+'];
 $('#ckeys').innerHTML=keys.map(k=>`<button onclick="ck('${k}')">${k}</button>`).join('')+'<button class="eq" onclick="ck(\'=\')">=</button>';
}
function ck(k){const d=$('#cdisp');if(k==='C')d.value='';else if(k==='⌫')d.value=d.value.slice(0,-1);else if(k==='='){try{const v=calcEval(d.value);if(!isFinite(v))throw 0;d.value=String(Math.round(v*1e8)/1e8)}catch(e){d.value='Error'}}else{if(d.value==='Error')d.value='';d.value+=k}}
function toggleCalc(){const c=$('#calc');c.hidden=!c.hidden}
let started=false;const start=()=>{if(started)return;started=true;initCalc();boot()};
document.addEventListener('DOMContentLoaded',start);
if(document.readyState!=='loading')start();
